# Self-test scenarios: <RULE>-bad must be blocked, <RULE>-good must pass (run offline against the fake).
scenarios:
- code: R-INTRO-bad
  group: self-test
  description: R-INTRO-bad
  contact: +00 555 000 0001
  channel: chat
  fake_only: true
  beats: &id001
  - &id002
    kind: fixed
    text: hi
  rules:
  - R-INTRO
  target_script:
  - replies:
    - Hi!
- code: R-INTRO-good
  group: self-test
  description: R-INTRO-good
  contact: +00 555 000 0001
  channel: chat
  fake_only: true
  beats: *id001
